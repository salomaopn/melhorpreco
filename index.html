<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelhorPreço - Cotação de Insumos (Dona do Lar)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container py-5">
 
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="card-title text-primary mb-1">MelhorPreço</h2>
            <p class="text-muted mb-4">Cotação comparativa de insumos — Restaurante Dona do Lar (Brasília/DF)</p>
            
            <form id="formBusca" class="row g-2">
                <div class="col-md-9">
                    <input type="text" id="inputProduto" class="form-control form-control-lg" 
                           placeholder="Digite o insumo (ex: Feijão Carioca 1kg, Óleo de Soja, Arroz 5kg)..." required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" id="btnBuscar" class="btn btn-primary btn-lg">Comparar Preços</button>
                </div>
            </form>
        </div>
    </div>

 
    <div id="loading" class="text-center my-5 d-none">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Consultando Atacadão Asa Norte, Mercado Livre e Shopee...</p>
    </div>

 
    <div id="alertaErro" class="alert alert-danger d-none" role="alert"></div>

    <div id="resultadoContainer" class="card shadow-sm d-none">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Resultados da Pesquisa</h5>
            <span id="contadorResultados" class="badge bg-secondary"></span>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Fornecedor</th>
                        <th>Produto Encontrado</th>
                        <th>Preço Unitário</th>
                        <th class="text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
    </div>
</div>

<script>

document.getElementById('formBusca').addEventListener('submit', async function(e) {
    e.preventDefault();
    const produto = document.getElementById('inputProduto').value.trim();
    if (!produto) return;

    const loading = document.getElementById('loading');
    const container = document.getElementById('resultadoContainer');
    const alertaErro = document.getElementById('alertaErro');
    const tbody = document.getElementById('tabelaCorpo');
    const btn = document.getElementById('btnBuscar');

    loading.classList.remove('d-none');
    container.classList.add('d-none');
    alertaErro.classList.add('d-none');
    btn.disabled = true;
    tbody.innerHTML = '';

    try {
        const response = await fetch(`api.php?produto=${encodeURIComponent(produto)}`);
        const dados = await response.json();

        // Verifica se o backend retornou um objeto de erro diagnóstico
        if (dados.erro) {
            alertaErro.textContent = dados.erro + (dados.detalhes ? ` (${dados.detalhes})` : '');
            alertaErro.classList.remove('d-none');
            return;

        }

        if (!Array.isArray(dados) || dados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Nenhum produto encontrado para esta busca.</td></tr>';
            document.getElementById('contadorResultados').textContent = '0 ofertas';
        } else {
            const menorPreco = dados[0].preco;
            dados.forEach((item) => {
                const isMelhor = item.preco === menorPreco;
                const tr = document.createElement('tr');
                if (isMelhor) tr.classList.add('table-success', 'fw-bold');

                const precoFormatado = item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                const badgeMelhor = isMelhor ? '<span class="badge bg-success ms-2">Melhor Preço</span>' : '';


                tr.innerHTML = `
                    <td>${item.fornecedor}</td>
                    <td>${item.titulo} ${badgeMelhor}</td>
                    <td>${precoFormatado}</td>
                    <td class="text-center">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-outline-primary">Ver Oferta</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('contadorResultados').textContent = `${dados.length} ofertas encontradas`;
        }
        container.classList.remove('d-none');
    } catch (error) {
        alertaErro.textContent = 'Erro de comunicação com o api.php. Verifique se o Apache do LAMPP está ativo e sem erros de sintaxe no PHP.';
        alertaErro.classList.remove('d-none');
    } finally {
        loading.classList.add('d-none');
        btn.disabled = false;
    }
});


</script>


</body>

</html>
